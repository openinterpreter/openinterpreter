[package]
edition.workspace = true
license.workspace = true
name = "codex-code-mode-runtime"
version.workspace = true

[lib]
doctest = false
name = "codex_code_mode_runtime"
path = "src/lib.rs"

[features]
# Open Interpreter ships code mode, so normal builds must include its V8
# runtime. Development-only builds can still opt out with --no-default-features.
default = ["v8-runtime"]
v8-runtime = ["dep:deno_core_icudata", "dep:v8"]

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
codex-code-mode-protocol = { workspace = true }
codex-plugin-host = { workspace = true }
codex-protocol = { workspace = true }
deno_core_icudata = { workspace = true, optional = true }
futures = { workspace = true }
opentelemetry = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec", "compat", "rt"] }
tracing = { workspace = true }
v8 = { workspace = true, features = ["v8_enable_sandbox"], optional = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
